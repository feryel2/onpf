<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <h1>ديوان الملكية العقارية</h1>
      <p>إدارة دراسة الملفات العقارية والوثائق القانونية</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input 
          type="text" 
          class="form-control" 
          id="username" 
          formControlName="username"
          placeholder="أدخل اسم المستخدم"
          required>
        <div class="error-message" *ngIf="submitted && username?.invalid">
          <small *ngIf="username?.errors?.['required']">اسم المستخدم مطلوب</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة السر</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          formControlName="password"
          placeholder="أدخل كلمة السر"
          required>
        <div class="error-message" *ngIf="submitted && password?.invalid">
          <small *ngIf="password?.errors?.['required']">كلمة السر مطلوبة</small>
        </div>
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="!loading">دخول</span>
        <span *ngIf="loading">جاري التحقق...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>© 2026 - الديوان الوطني للملكية العقارية</p>
    </div>
  </div>
</div>
