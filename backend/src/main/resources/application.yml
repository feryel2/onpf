spring:
  application:
    name: onpf-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/onpf_db?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
    open-in-view: false
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    tn.gov.onpf: DEBUG

app:
  jwtSecret: "your-secret-key-change-this-in-production-environment-with-a-strong-key"
  jwtExpirationMs: 86400000
